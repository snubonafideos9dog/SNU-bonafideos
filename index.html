<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반듯한정형외과 환자 안내</title>

  <!-- CSS 모듈 엔트리 (각 모듈을 @import 로 묶음) -->
  <link rel="stylesheet" href="css/main.css" />
</head>

<body>
  <div class="container">
    <!-- 상단 언어 선택 (홈) -->
    <div class="page-topbar" style="justify-content:center;">
      <div class="lang-switch" aria-label="Language switch">
        <button type="button" class="lang-btn active" data-lang="ko" onclick="setLanguage('ko')">한국어</button>
        <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
      </div>
    </div>

    <!-- 컴포넌트 마운트 지점: js/main.js 가 components/*.html 을 fetch 하여 조립 -->
    <div data-component="header"></div>
    <div data-component="nav"></div>
    <div data-component="footer"></div>
  </div>

  <!-- JS 모듈: 전역 함수(onclick 핸들러)로 사용하므로 일반 스크립트로 로드 -->
  <script src="js/clinic.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
