<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8efe8"/>
      <stop offset="100%" stop-color="#efe4d8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect x="70" y="70" width="1060" height="1460" rx="48" fill="#ffffff" stroke="#d8c2b0" stroke-width="6"/>
  <text x="600" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#6b5d50">Post-Injection Care</text>
  <text x="600" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#6b5d50">Instructions</text>
  <rect x="160" y="420" width="880" height="8" rx="4" fill="#d8c2b0"/>
  <text x="180" y="540" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#6b5d50">1. Rest for 24 hours</text>
  <text x="180" y="640" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#6b5d50">2. Avoid strenuous activity</text>
  <text x="180" y="740" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#6b5d50">3. Apply cold compress if swelling occurs</text>
  <text x="180" y="840" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#6b5d50">4. Follow medication instructions</text>
  <text x="180" y="940" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#6b5d50">5. Contact the clinic if symptoms worsen</text>
  <rect x="250" y="1100" width="700" height="180" rx="36" fill="#6b5d50"/>
  <text x="600" y="1215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Please follow the doctor&apos;s guidance</text>
</svg>