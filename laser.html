<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고출력레이저치료 | 반듯한정형외과</title>
  <link rel="stylesheet" href="css/main.css" />
</head>

<body>
  <div class="container">
    <div class="page-topbar">
      <div class="lang-switch" aria-label="Language switch">
        <button type="button" class="lang-btn active" data-lang="ko" onclick="setLanguage('ko')">한국어</button>
        <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
      </div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="close-page-btn" onclick="goPage('stretch.html')" data-ko="← 뒤로" data-en="← Back" data-i18n="true">← 뒤로</button>
        <button type="button" class="close-page-btn" onclick="closeTreatmentPage()" data-ko="✕ 닫기" data-en="✕ Close" data-i18n="true">✕ 닫기</button>
      </div>
    </div>

    <div data-component="laser"></div>
  </div>

  <script src="js/clinic.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/viewer.js"></script>
  <script>
    function closeTreatmentPage(){
      window.close();
      setTimeout(function(){
        if(!window.closed){ goPage('index.html'); }
      }, 150);
    }
  </script>
  <script src="js/main.js"></script>
</body>
</html>
